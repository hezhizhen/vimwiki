---
# Commented out to avoid verbosity on github commit status
name: CI

# yamllint disable-line rule:truthy
on: [push, pull_request, workflow_dispatch]

jobs:
  Typos:
    # Copied from: https://github.com/junegunn/fzf/blob/master/
    # -- .github/workflows/typos.yml
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: crate-ci/typos@v1.51.1
        with:
          config: ./test/resources/typos_config.toml


  Yamllint:
    # Copied from: https://github.com/junegunn/fzf/blob/master/
    # -- .github/workflows/typos.yml
    name: Yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/test-vader-action.yml


  Vint:
    # Copied from: https://github.com/LudvigHz/vint-action
    # And local ./test/run_test.sh
    name: Vint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: ludvighz/vint-action@v1
        with:
          path: .
          args: --style-problem
      - uses: ludvighz/vint-action@v1
        with:
          path: test/vimrc
          args: --style-problem


  Check:
    name: Check latest ${{ matrix.editor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [vim, nvim]
    steps:
      # This action is required to fetch the code to test
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Resolve current editor releases
        id: editors
        run: |
          vim_version=$(git ls-remote --tags --refs \
            https://github.com/vim/vim.git 'v[0-9]*' \
            | sed 's,.*refs/tags/,,' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          nvim_version=$(curl -fsSL \
            https://api.github.com/repos/neovim/neovim/releases/latest \
            | python3 -c \
              'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          test -n "$vim_version"
          test -n "$nvim_version"
          printf 'vim=%s\nnvim=%s\n' "$vim_version" "$nvim_version" \
            >> "$GITHUB_OUTPUT"

      # Cache the image using the editor tags resolved for this run.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vimwiki:latest
          load: true
          build-args: |
            VIM_VERSION=${{ steps.editors.outputs.vim }}
            NVIM_VERSION=${{ steps.editors.outputs.nvim }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Check
        run: |
          cd test
          bash run_tests.sh -v -t vader -n "$EDITOR"
        env:
          EDITOR: ${{ matrix.editor }}
